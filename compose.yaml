services:
  db:
    image: postgres:18-alpine
    container_name: procurement_db
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-local-password
      POSTGRES_DB: procurement_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d procurement_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
